name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: extractions/setup-just@v2

      - name: Generate code
        run: just generate

      - name: Check generated code is up to date
        run: |
          git diff --exit-code || (echo "Generated code is out of date. Run 'just generate' and commit." && exit 1)

      - name: Build
        run: just build

      - name: Unit tests
        run: just test-unit

      - name: Integration tests (dockertest + PostgreSQL)
        run: just test-integration

  fuzz:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: schemathesis/action@v2
        with:
          schema: api/openapi-spec/2.0/openapi.yaml
